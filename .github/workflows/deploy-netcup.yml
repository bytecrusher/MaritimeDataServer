name: Deploy to Netcup mds-git

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: deploy-netcup-mds-git
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy mds-git.derguntmar.de
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate PHP syntax
        run: |
          find app bootstrap config public tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          sshPrivateKey: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          remoteHost: ${{ secrets.NETCUP_SSH_HOST }}
          remoteUser: ${{ secrets.NETCUP_SSH_USER }}
          remotePort: ${{ secrets.NETCUP_SSH_PORT || '22' }}
          source: ./
          target: ${{ vars.NETCUP_DEPLOY_PATH || secrets.NETCUP_DEPLOY_PATH || '/var/www/vhosts/hosting157867.a2eee.netcup.net/httpdocs/mds-git.derguntmar.de/' }}
          args: -rlgoDzvc --delete
          exclude: >-
            .git/,
            .github/,
            .DS_Store,
            .env,
            config.json,
            config/config.json,
            .aider*,
            .aider-desk/,
            .vscode/,
            docu_donotdeploy/,
            docs/db_design/*.sql,
            node_modules/,
            var/log/*,
            var/status/*.json,
            var/ota/*
          scriptAfter: |
            cd "${{ vars.NETCUP_DEPLOY_PATH || secrets.NETCUP_DEPLOY_PATH || '/var/www/vhosts/hosting157867.a2eee.netcup.net/httpdocs/mds-git.derguntmar.de/' }}"
            mkdir -p var/log var/status var/ota
            chmod 755 var var/log var/status var/ota
            PHP_BINARY="${{ secrets.DEPLOY_PHP_BINARY || '/opt/plesk/php/8.3/bin/php' }}"
            if [ -x "$PHP_BINARY" ]; then
              find app bootstrap config public tools -name '*.php' -print0 | xargs -0 -n1 "$PHP_BINARY" -l
            else
              echo "Configured PHP binary is not executable: $PHP_BINARY"
              exit 1
            fi

name: Deploy to Netcup mds-git

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: deploy-netcup-mds-git
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy mds-git.derguntmar.de
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate PHP syntax
        run: |
          find app bootstrap config public tests tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Run regression tests
        run: composer test

      - name: Validate deployment secrets
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_HOST: ${{ vars.NETCUP_SSH_HOST || secrets.NETCUP_SSH_HOST }}
          NETCUP_SSH_USER: ${{ vars.NETCUP_SSH_USER || secrets.NETCUP_SSH_USER }}
        run: |
          test -n "$NETCUP_SSH_PRIVATE_KEY" || { echo "Missing secret: NETCUP_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$NETCUP_SSH_HOST" || { echo "Missing variable or secret: NETCUP_SSH_HOST"; exit 1; }
          test -n "$NETCUP_SSH_USER" || { echo "Missing variable or secret: NETCUP_SSH_USER"; exit 1; }

      - name: Prepare SSH key
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_HOST: ${{ vars.NETCUP_SSH_HOST || secrets.NETCUP_SSH_HOST }}
          NETCUP_SSH_PORT: ${{ vars.NETCUP_SSH_PORT || secrets.NETCUP_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          ssh-keyscan -p "$NETCUP_SSH_PORT" "$NETCUP_SSH_HOST" >> ~/.ssh/known_hosts || echo "Warning: ssh-keyscan failed; SSH will use StrictHostKeyChecking=accept-new."

      - name: Package deployment archive
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.DS_Store' \
            --exclude='./.env' \
            --exclude='./config.json' \
            --exclude='./config/config.json' \
            --exclude='./.aider*' \
            --exclude='./.aider-desk' \
            --exclude='./.vscode' \
            --exclude='./docu_donotdeploy' \
            --exclude='./docs/db_design/*.sql' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./var/log/*' \
            --exclude='./var/status/*.json' \
            --exclude='./var/sessions/*' \
            --exclude='./var/ota/*' \
            -czf /tmp/mds-git-deploy.tar.gz .

      - name: Deploy via scp over SSH
        env:
          NETCUP_SSH_HOST: ${{ vars.NETCUP_SSH_HOST || secrets.NETCUP_SSH_HOST }}
          NETCUP_SSH_USER: ${{ vars.NETCUP_SSH_USER || secrets.NETCUP_SSH_USER }}
          NETCUP_SSH_PORT: ${{ vars.NETCUP_SSH_PORT || secrets.NETCUP_SSH_PORT || '22' }}
          NETCUP_DEPLOY_PATH: ${{ vars.NETCUP_DEPLOY_PATH || secrets.NETCUP_DEPLOY_PATH || '/var/www/vhosts/hosting157867.a2eee.netcup.net/httpdocs/mds-git.derguntmar.de/' }}
          DEPLOY_PHP_BINARY: ${{ vars.DEPLOY_PHP_BINARY || secrets.DEPLOY_PHP_BINARY || '/opt/plesk/php/8.3/bin/php' }}
        run: |
          SSH_OPTS="-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          scp -P "$NETCUP_SSH_PORT" -i ~/.ssh/netcup_deploy_key $SSH_OPTS /tmp/mds-git-deploy.tar.gz "$NETCUP_SSH_USER@$NETCUP_SSH_HOST:/tmp/mds-git-deploy.tar.gz"
          ssh -p "$NETCUP_SSH_PORT" -i ~/.ssh/netcup_deploy_key $SSH_OPTS "$NETCUP_SSH_USER@$NETCUP_SSH_HOST" "DEPLOY_PATH='$NETCUP_DEPLOY_PATH' PHP_BINARY='$DEPLOY_PHP_BINARY' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          PRESERVED_PUBLIC_OTA="/tmp/mds-public-ota-bin"
          rm -rf "$PRESERVED_PUBLIC_OTA"
          if [ -d ./public/ota/bin ]; then
            mkdir -p "$PRESERVED_PUBLIC_OTA"
            cp -a ./public/ota/bin/. "$PRESERVED_PUBLIC_OTA/"
          fi

          find . -mindepth 1 \( \
            -path './.env' -o \
            -path './config.json' -o \
            -path './config' -o \
            -path './config/config.json' -o \
            -path './var' -o \
            -path './var/*' \
          \) -prune -o -exec rm -rf {} +

          tar -xzf /tmp/mds-git-deploy.tar.gz -C "$DEPLOY_PATH"
          rm -f /tmp/mds-git-deploy.tar.gz

          mkdir -p public/ota/bin var/log var/status var/sessions var/ota
          if [ -d "$PRESERVED_PUBLIC_OTA" ]; then
            cp -a "$PRESERVED_PUBLIC_OTA/." public/ota/bin/
            rm -rf "$PRESERVED_PUBLIC_OTA"
          fi
          chmod 755 public/ota/bin var var/log var/status var/ota
          chmod 700 var/sessions

          PHP_CANDIDATES="$PHP_BINARY /opt/plesk/php/8.3/bin/php /opt/plesk/php/8.2/bin/php /opt/plesk/php/8.1/bin/php /usr/bin/php php"
          RESOLVED_PHP_BINARY=""
          for PHP_CANDIDATE in $PHP_CANDIDATES; do
            if command -v "$PHP_CANDIDATE" >/dev/null 2>&1; then
              RESOLVED_PHP_BINARY="$(command -v "$PHP_CANDIDATE")"
              break
            fi
            if [ -x "$PHP_CANDIDATE" ]; then
              RESOLVED_PHP_BINARY="$PHP_CANDIDATE"
              break
            fi
          done

          if [ -z "$RESOLVED_PHP_BINARY" ]; then
            echo "No executable PHP binary found. Checked: $PHP_CANDIDATES"
            exit 1
          fi

          echo "Using PHP binary: $RESOLVED_PHP_BINARY"
          find app bootstrap config public tools -name '*.php' -print0 | xargs -0 -n1 "$RESOLVED_PHP_BINARY" -l
          REMOTE_DEPLOY
